name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  check:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: packaging/check-version.sh "${GITHUB_REF_NAME#v}"

  fedora:
    name: COPR
    needs: check
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y cargo cargo-rpm-macros copr-cli git-core glibc-langpack-en rpm-build rpmlint tar xz

      - uses: actions/checkout@v4

      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: rpmlint -r packaging/fedora/.rpmlintrc packaging/fedora/shaya.spec

      - run: packaging/fedora/create-srpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: srpm
          path: ~/rpmbuild/SRPMS/*.src.rpm

      - name: Submit to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          mkdir -p ~/.config
          umask 077
          cat > ~/.config/copr <<EOF
          [copr-cli]
          copr_url = https://copr.fedorainfracloud.org
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_API_TOKEN}
          EOF
          copr-cli build shaya ~/rpmbuild/SRPMS/*.src.rpm

  arch:
    name: AUR
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin the source checksum
        run: |
          curl -fsSL -o source.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz"
          sha="$(sha256sum source.tar.gz | cut -d' ' -f1)"
          sed -i "s/^sha256sums=.*/sha256sums=('$sha')/" packaging/arch/PKGBUILD

      - name: Build and lint
        run: |
          mkdir build
          cp packaging/arch/PKGBUILD build/
          docker run --rm -v "$PWD/build:/build" archlinux:latest bash -euc '
            pacman -Syu --noconfirm --needed base-devel namcap
            source /build/PKGBUILD
            pacman -S --noconfirm --needed "${depends[@]}" "${makedepends[@]}"
            useradd -m builder
            chown -R builder /build
            cd /build
            su builder -c "makepkg --noconfirm"
            namcap PKGBUILD ./*.pkg.tar.zst
          '

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: shaya
          pkgbuild: packaging/arch/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
