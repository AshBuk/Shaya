name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  check:
    name: Clippy & Tests
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - run: |
          apt-get update
          apt-get install -y build-essential ca-certificates curl git pkg-config \
            libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
