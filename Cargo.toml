[package]
name = "shaya"
version = "0.1.0"
description = "Native AI assistant for Linux, built with Rust and GTK4."
authors = ["Asher Buk"]
license = "Apache-2.0"
repository = "https://github.com/AshBuk/Shaya"
homepage = "https://github.com/AshBuk/Shaya"
edition = "2021"
rust-version = "1.89"
keywords = ["linux", "rust", "ai", "assistant", "privacy", "wayland", "gtk4"]
categories = ["gui", "accessibility"]

[lib]
name = "shaya_lib"
crate-type = ["rlib"]

[[bin]]
name = "shaya"
path = "src/main.rs"

[dependencies]
# GTK4 + Adwaita (UI)
gtk4 = { version = "0.10", features = ["v4_6"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
gtk4-layer-shell = "0.7"

# Core utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "5.0"

# HTTP client (AI/STT APIs) - blocking, wrapped in gio::spawn_blocking
ureq = { version = "2.10", features = ["json"] }

# Audio processing
hound = "3.5.1"
base64 = "0.22"
libc = "0.2"

# Unix signals for single-instance
nix = { version = "0.29", features = ["signal"] }

# Date/time formatting
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
